    return '<div class="it"><span>'+e.period+'</span><h5>'+e.role+'</h5><em>'+e.place+'</em><p>'+e.text+'</p></div>';
  }).join("");

  $("#toolsList").innerHTML = SITE.tools.map(function(t){return '<div class="tool"><b>'+t.abbr+'</b>'+t.name+'</div>'}).join("");
  $("#skillsList").innerHTML = SITE.skills.map(function(s){
    return '<div class="bar"><div class="h"><span>'+s.name+'</span><span>'+s.level+'%</span></div><div class="t"><div class="f" style="--w:'+s.level+'%"></div></div></div>';
  }).join("");

  $("#tTrack").innerHTML = SITE.testimonials.map(function(t){
    return '<div class="t-slide"><i class="fa-solid fa-quote-left q"></i><p>'+t.text+'</p><small>— '+t.name+', '+t.role+'</small></div>';
  }).join("");
  var tIdx = 0, tN = SITE.testimonials.length, tTimer;
  $("#tDots").innerHTML = SITE.testimonials.map(function(_,i){return '<button class="dot-b" aria-label="Slide '+(i+1)+'" data-d="'+i+'"></button>'}).join("");
  function tGo(i){ tIdx = (i+tN)%tN; $("#tTrack").style.transform = "translateX(-"+(tIdx*100)+"%)"; $$(".dot-b").forEach(function(d,k){d.classList.toggle("active",k===tIdx)}); }
  function tAuto(){ clearInterval(tTimer); tTimer = setInterval(function(){tGo(tIdx+1)},5500); }
  $$(".dot-b").forEach(function(d){d.addEventListener("click",function(){tGo(+d.getAttribute("data-d")); tAuto();})});
  tGo(0); tAuto();

  $("#contactList").innerHTML =
    '<a class="ci" href="tel:+'+C.phoneIntl+'"><i class="fa-solid fa-phone"></i>'+C.phone+'</a>'+
    '<a class="ci" href="mailto:'+C.email+'"><i class="fa-solid fa-envelope"></i>'+C.email+'</a>'+
    '<a class="ci" href="'+C.googleMapLink+'" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-location-dot"></i>'+C.location+'</a>';
  $("#socBig").innerHTML = SITE.social.slice(0,3).map(function(s){return '<a href="'+s.url+'" target="_blank" rel="noopener noreferrer"><i class="'+s.icon+'"></i>'+s.label+'</a>'}).join("");
  $("#mapFrame").src = C.googleMapEmbed;

  function toast(msg, ok){
    var t = $("#toast"); t.innerHTML = '<i class="fa-solid '+(ok?"fa-circle-check":"fa-circle-exclamation")+' mr-2" style="color:'+(ok?"#22c55e":"#ef4444")+'"></i>'+msg;
    t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function(){t.classList.remove("show")},4500);
  }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]}); }
  $("#contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    var f = e.target, d = { name:f.name.value.trim(), phone:f.phone.value.trim(), email:f.email.value.trim(), message:f.message.value.trim() };
    if(f.website.value) return;
    if(!d.name || !d.phone || !d.email || !d.message){ toast("Please fill in all fields.", false); return; }
    if(!/^\S+@\S+\.\S+$/.test(d.email)){ toast("Please enter a valid email address.", false); return; }
    var btn = $("#submitBtn"); btn.disabled = true; $("#submitTxt").textContent = "Sending...";
    var jobs = [], F = SITE.form;
    if(F.googleScriptUrl){
      jobs.push(fetch(F.googleScriptUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(d).toString()}));
    }
    if(F.telegramBotToken && F.telegramChatId){
      var text = "<b>New Portfolio Message</b>\n\n<b>Name:</b> "+esc(d.name)+"\n<b>Phone:</b> "+esc(d.phone)+"\n<b>Email:</b> "+esc(d.email)+"\n<b>Message:</b> "+esc(d.message);
      jobs.push(fetch("https://api.telegram.org/bot"+F.telegramBotToken+"/sendMessage",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:F.telegramChatId,text:text,parse_mode:"HTML"})}));
    }
    if(!jobs.length){
      window.location.href = "mailto:"+C.email+"?subject="+encodeURIComponent("Message from "+d.name)+"&body="+encodeURIComponent(d.message+"\n\nPhone: "+d.phone+"\nEmail: "+d.email);
      btn.disabled = false; $("#submitTxt").textContent = "Send Message"; return;
    }
    Promise.all(jobs).then(function(){ toast("Message sent successfully! I will contact you soon.", true); f.reset(); })
      .catch(function(){ toast("Something went wrong. Please call or email me directly.", false); })
      .then(function(){ btn.disabled = false; $("#submitTxt").textContent = "Send Message"; });
  });

  (function(){
    var el = $("#typed"), w = 0, c = 0, del = false;
    function tick(){
      var word = SITE.roles[w];
      el.textContent = word.substring(0, c);
      if(!del && c === word.length){ del = true; return setTimeout(tick, 1600); }
      if(del && c === 0){ del = false; w = (w+1)%SITE.roles.length; return setTimeout(tick, 350); }
      c += del ? -1 : 1;
      setTimeout(tick, del ? 38 : 85);
    }
    tick();
  })();

  setTimeout(function(){ document.body.classList.add("loaded"); }, 300);

  var circle = $("#circle"), photo = $("#photo"), secs = NAV.map(function(n){return document.getElementById(n[0])});
  function onScroll(){
    var y = window.scrollY, h = document.documentElement.scrollHeight - window.innerHeight;
    $("#progress").style.width = (y/h*100)+"%";
    $("#nav").classList.toggle("scrolled", y > 40);
    $("#toTop").classList.toggle("show", y > 600);
    if(y < window.innerHeight*1.2){
      circle.style.transform = "translateY("+(y*0.12)+"px)";
      photo.style.transform = "translateY("+(y*-0.04)+"px)";
    }
    var cur = "home";
    secs.forEach(function(s){ if(s && s.getBoundingClientRect().top < window.innerHeight*0.4) cur = s.id; });
    $$(".nav-link").forEach(function(a){ a.classList.toggle("active", a.getAttribute("data-id")===cur); });
  }
  window.addEventListener("scroll", onScroll, {passive:true}); onScroll();
  $("#toTop").addEventListener("click",function(){ window.scrollTo({top:0,behavior:"smooth"}); });
})();
//]]>
</script>
